# Config for the Spark Structured Streaming console job. Nothing here is code.
#
# ${VAR} placeholders are resolved at startup from docker/.env (git-ignored, written by
# docker/certs/generate-certs.sh) - see ConfigLoader. This mirrors how application.yml resolves
# ${KAFKA_TRUSTSTORE_PASSWORD} etc. via Spring's spring.config.import.
#
# All relative paths (keytab, truststore, checkpoint) assume the JVM's working directory is the
# repo root, same convention application.yml uses. The exec-maven-plugin config in pom.xml sets
# that automatically for `mvn exec:java`.

bootstrap.servers=localhost:9094
topic=dummy-topic
schema.registry.url=http://localhost:8081
checkpoint.location=spark-streaming/checkpoint/dummy-topic-console

# Passed straight through to Spark's Kafka source via its kafka.* option prefix, which forwards
# each one (minus the prefix) to the underlying Kafka consumer - the same settings
# application.yml sets under spring.kafka.properties for the Spring Boot producer/consumer.
kafka.security.protocol=SASL_SSL
kafka.sasl.mechanism=GSSAPI
kafka.sasl.kerberos.service.name=kafka
kafka.sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="docker/kerberos/keytabs/client.keytab" principal="client@EXAMPLE.COM";
kafka.ssl.truststore.location=docker/certs/truststore.jks
kafka.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
kafka.ssl.keystore.location=docker/certs/client.keystore.jks
kafka.ssl.keystore.password=${KAFKA_CLIENT_KEYSTORE_PASSWORD}
kafka.ssl.key.password=${KAFKA_CLIENT_KEYSTORE_PASSWORD}
