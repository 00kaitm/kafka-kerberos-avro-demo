spring:
  config:
    # Passwords live in docker/.env (git-ignored), written by docker/certs/generate-certs.sh.
    import: optional:file:docker/.env[.properties]
  application:
    name: SpringBootPractice
  kafka:
    bootstrap-servers: localhost:9094
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: GSSAPI
      sasl.kerberos.service.name: kafka
      ssl.truststore.location: docker/certs/truststore.jks
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD}
      ssl.keystore.location: docker/certs/client.keystore.jks
      ssl.keystore.password: ${KAFKA_CLIENT_KEYSTORE_PASSWORD}
      ssl.key.password: ${KAFKA_CLIENT_KEYSTORE_PASSWORD}
      sasl.jaas.config: >-
        com.sun.security.auth.module.Krb5LoginModule required
        useKeyTab=true
        storeKey=true
        keyTab="docker/kerberos/keytabs/client.keytab"
        principal="client@EXAMPLE.COM";
      schema.registry.url: http://localhost:8081
      specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Both are already the client defaults (Kafka 3.0+), set explicitly so an unrelated
      # config change can't silently turn them off - see README "Reliability".
      acks: all
      properties:
        # Boot has no dedicated property for this one, so it goes in the pass-through map.
        enable.idempotence: true
        # retries, max.in.flight.requests.per.connection and delivery.timeout.ms are left at
        # their defaults (MAX_INT, 5, 120000), which are what idempotence requires/expects.
    consumer:
      group-id: dummy-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped so a malformed record is reported and skipped instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer

app:
  kafka:
    topic: dummy-topic
    # Where records go once retries are exhausted, or straight away for ones that can never
    # succeed. Created by docker/init-topics.sh. See README "Retries and the dead-letter topic".
    dlt-topic: dummy-topic-dlt
    dlt-group-id: dummy-dlt-inspector
    retry:
      # Waits 1s, 2s, 4s, 4s between the 5 attempts (1 + 4 retries): 11s of back off in total.
      # max-interval caps the doubling. The back off sleeps the consumer thread, so it counts
      # against the consumer's max.poll.interval.ms (default 300s) - keep it well under that.
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 4000
      max-retries: 4
    # Text markers that make DummyConsumer fail on purpose, plus the poison-pill endpoint.
    failure-demo:
      enabled: true
      transient-marker: fail-transient   # fails the first transient-failures attempts, then succeeds
      transient-failures: 2
      always-marker: fail-always         # retryable, but never succeeds: exhausts retries, then DLT
      invalid-marker: fail-invalid       # not retryable: straight to the DLT
